# MkDocs configuration for Paxman — User Documentation
# Read the Docs builds from this file (see .readthedocs.yaml).
# Docs start from v0.2.0 (first version with stable user docs).

site_name: Paxman
site_description: Canonicalization authority resolver — deterministic, provenance-first.
site_author: Paxman Authors
site_url: https://paxman.readthedocs.io/
repo_url: https://github.com/nexusnv/paxman-python
repo_name: nexusnv/paxman-python
edit_uri: edit/main/docs/user/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    logo: material/book-open-page-variant

# Where the user docs live — only docs/user is published.
docs_dir: docs/user
site_dir: site

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts:
      - Overview: concepts/index.md
      - Capabilities: concepts/capabilities.md
      - Contracts: concepts/contracts.md
      - Pipeline: concepts/pipeline.md
      - Execution Result: concepts/execution-result.md
      - Provenance: concepts/provenance.md
      - Candidates & Ambiguity: concepts/candidates-and-ambiguity.md
      - Errors: concepts/errors.md
  - Capabilities:
      - Overview: capabilities/index.md
      - Email: capabilities/email.md
      - Country: capabilities/country.md
      - Currency: capabilities/currency.md
      - Date: capabilities/date.md
      - IP: capabilities/ip.md
      - ISBN: capabilities/isbn.md
      - Money: capabilities/money.md
      - Phone: capabilities/phone.md
      - SI Unit: capabilities/si-unit.md
      - URL: capabilities/url.md
  - API Reference: api-reference.md
  - Extending: extending.md
  - Migration: migration.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nexusnv/paxman-python
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/paxman/

extra_css: []
extra_javascript: []

# Strict build — warnings become errors (parity with ruff/pyright).
# Docs contain many cross-links to files outside docs_dir (e.g. ../../README.md,
# ARCHITECTURE.md) that are intentionally external — do not fail on them.
# Read the Docs will still build with strict, but local `mkdocs build --strict`
# is used in CI docs job — keep it strict for user docs, ignore external links.
strict: false
