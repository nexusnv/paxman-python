name: Docs

on:
  push:
    branches: [main, dev]
    tags:
      - "v*.*.*"
    paths:
      - "docs/user/**"
      - "docs_site/**"
      - "paxman/**"
      - "pyproject.toml"
  pull_request:
    branches: [main, dev]
    paths:
      - "docs/user/**"
      - "docs_site/**"
      - "paxman/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deploy needs single concurrency; builds can run in parallel per ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build docs (Astro Starlight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs_site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs_site
        run: npm ci

      - name: Install Playwright browser (for rehype-mermaid)
        working-directory: docs_site
        run: npx playwright install --with-deps chromium

      - name: Build docs with Astro
        working-directory: docs_site
        run: npm run build

      # PRs: keep artifact for preview / debugging (no Pages deploy).
      - name: Upload site artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs_site/dist/
          if-no-files-found: error

      # main / dev / tags: publish via GitHub Pages (actions/deploy-pages).
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site/dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
