[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paxman"
version = "0.2.0"
description = "Canonicalization authority resolver"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nexusnv/paxman-python"
Repository = "https://github.com/nexusnv/paxman-python"
Issues = "https://github.com/nexusnv/paxman-python"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
paxman = "paxman.cli:main"

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
    "capability: capability-specific tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "property: property-based tests (Hypothesis)",
    "benchmark: benchmark harness tests",
    "country: country capability tests",
    "currency: currency capability tests",
    "isbn: isbn capability tests",
    "issn: issn capability tests",
    "money: money capability tests",
    "si_unit: si unit capability tests",
    "url: url capability tests",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["paxman"]
branch = true
# Widget is the transient package used only by tests/unit/test_new_capability_tool.py;
# it is scaffolded into the real tree and must not dent per-package coverage.
# Real scaffolded capabilities (e.g. Timezone) are committed and intentionally covered,
# so do not broaden this to Widget* — the test fixture cleans up byte-for-byte.
omit = ["tests/*", "paxman/capabilities/Widget/*", "benchmarks/*", "paxman/cli.py", "paxman/__main__.py", "paxman/capabilities/IBAN/grammar/data/*", "paxman/capabilities/Language/grammar/data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    # Bare `...` bodies in abstract methods and Protocol declarations are
    # non-executable by design; they are unreachable by any test.
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Section-numbered rule class names (Section6_1...) trip N801 by design.
# Inline `# noqa` is prohibited in this project's source, so a scoped
# config exception is used instead. N801-only; does not suppress other rules.
"paxman/capabilities/Phone/rules/*.py" = ["N801"]
"tests/capabilities/phone/*.py" = ["N801"]
# All-caps acronym aliases (ISBNCapability as ISBN) trip N814 by design.
# Inline `# noqa` is prohibited in this project's source, so a scoped
# config exception is used instead. N814-only; does not suppress other rules.
"paxman/capabilities/__init__.py" = ["N814"]
# Top-level error boundaries must catch blind Exception to surface
# structured errors; inline `# noqa: BLE001` is prohibited per AGENTS.md,
# so a scoped exception is used instead. BLE001-only.
"paxman/engine/orchestrator.py" = ["BLE001"]
"paxman/cli.py" = ["BLE001"]
# Long docstring line trips E501 by design; inline `# noqa` prohibited.
"paxman/capabilities/Language/rules/iana_language_subtag_registry_ed2026.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
include = ["paxman"]
exclude = ["tests", "docs"]

[tool.importlinter]
root_package = "paxman"

[[tool.importlinter.contracts]]
name = "Capability independence"
type = "layers"
layers = [
    "paxman.api",
    "paxman.engine",
    "paxman.capabilities",
    "paxman.core",
]

[tool.hatch.build.targets.wheel]
packages = ["paxman"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pyright>=1.1",
    "import-linter>=2.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]
